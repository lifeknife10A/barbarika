[project]
name = "barbarika-compliance"
version = "0.1.0"
description = "Fills the official CERT-In Incident Reporting Form from a confirmed incident in the Sentry vault, with an independent evidence-integrity attestation."
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",       # draw the overlay + render the annexure pages
    "pypdf>=4.0",           # stamp our values onto the authentic CERT-In form + merge
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42.0",   # AES-GCM unseal (reused from sentry vault format)
    "pyyaml>=6.0",          # read the fired rule's description from rules/rules/v1/*.yaml
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
barbarika-compliance = "barbarika_compliance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barbarika_compliance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# NOTE: this package re-verifies the vault's hash chain using Sentry's own
# canonical primitives (sentry/app/crypto.py + hashchain.py), imported at runtime
# via sys.path (see vault.py) so the formula can never drift. It reads the vault
# read-only and never modifies sentry/.
