[project]
name = "barbarika-compliance"
version = "0.1.0"
description = "Fills the official CERT-In Incident Reporting Form from a confirmed incident in the Sentry vault, with an independent evidence-integrity attestation."
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",     # fill the authentic CERT-In form's DOCX table cells
    "pymupdf>=1.24",        # tick the form's checkboxes on the rendered PDF (text-anchored)
    "reportlab>=4.0",       # render the Detailed Incident Report annexure pages
    "pypdf>=4.0",           # merge the filled form page + annexure; lock metadata
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42.0",   # AES-GCM unseal (reused from sentry vault format)
    "pyyaml>=6.0",          # read the fired rule's description from rules/rules/v1/*.yaml
]

# RUNTIME SYSTEM REQUIREMENT: LibreOffice (`soffice`) must be installed on the host
# running this service — page 1 is produced by filling the official form's DOCX and
# converting it to PDF with `soffice --headless --convert-to pdf` (see formdoc.py).

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
barbarika-compliance = "barbarika_compliance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barbarika_compliance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# NOTE: this package re-verifies the vault's hash chain using Sentry's own
# canonical primitives (sentry/app/crypto.py + hashchain.py), imported at runtime
# via sys.path (see vault.py) so the formula can never drift. It reads the vault
# read-only and never modifies sentry/.
