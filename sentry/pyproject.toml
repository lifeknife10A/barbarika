[project]
name = "barbarika-sentry"
version = "0.2.0"
description = "Barbarika Sentry — mTLS ingestion API + hash-chained SQLite evidence vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
    "cryptography>=43",
    "pyyaml>=6.0.2",
    "barbarika-rules",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.uv.sources]
barbarika-rules = { path = "../rules", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
