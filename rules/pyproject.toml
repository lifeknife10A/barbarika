[project]
name = "barbarika-rules"
version = "0.1.0"
description = "Normalized event schema and versioned detection rules for Barbarika"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barbarika_rules"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

